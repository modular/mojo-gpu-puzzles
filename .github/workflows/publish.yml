name: Publish Puzzles

on:
  push:
    branches:
      - stable
    paths:
      - "pixi.lock"
      - ".github/workflows/publish.yml"
      - "book/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.modular
            ~/.cache/modular
          key: ${{ runner.os }}-modular-${{ hashFiles('**/pixi.toml') }}

      - uses: prefix-dev/setup-pixi@fef5c9568ca6c4ff7707bf840ab0692ba3f08293
        with:
          pixi-version: v0.71.0
          cache: false
          post-cleanup: false
          run-install: false

      - name: Install
        shell: bash
        run: pixi install --locked --manifest-path pixi.toml

      - name: Build
        shell: bash
        run: |
          cd book
          pixi run -e book build-book

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/stable'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./book/html
          cname: puzzles.modular.com
          allow_empty_commit: true
